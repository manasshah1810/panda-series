<!doctype html>
<html><head><meta charset="utf-8"><title>EP01 Kitchen demo</title>
<style>
  html,body{margin:0;height:100%;background:#1b1917;color:#e8e1d6;font:12px/1.35 system-ui,sans-serif;overflow:hidden}
  canvas{display:block}
  #ui{position:fixed;top:8px;left:8px;max-width:250px;background:#2a2623cc;padding:8px 10px;border-radius:8px;backdrop-filter:blur(4px)}
  #ui h4{margin:6px 0 3px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:#b9ad9b}
  #ui button{margin:1px 2px 1px 0;background:#4a423a;color:#f0e8dc;border:0;border-radius:4px;padding:3px 6px;cursor:pointer;font-size:11px}
  #ui button:hover{background:#6b5d4f} #ui input[type=range]{width:200px} #ui select{font-size:11px}
  #stats{margin-top:4px;color:#b9ad9b}
</style></head>
<body><div id="ui"></div><script type="module" src="./main.js"></script></body></html>
